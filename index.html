<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מזכירה רפואית בכירה — קורס 16 | קארינה דרור</title>
<meta name="description" content="אתר הקורס מזכירה רפואית בכירה — מפת המסלול, 13 השיעורים, חומרי הלימוד ושיעורי הבית.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#061C25; --ink2:#0A2733; --panel:#0D2E3C; --panel2:#113A4B;
  --teal:#174759; --gold:#C2A15A; --gold-soft:#E0C68B; --vital:#5FD4B4;
  --cream:#F6F2E9; --muted:#9DB6C0; --line:rgba(246,242,233,.13);
  --rad:14px; --maxw:1240px; --fs:100%;
}
*{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
html,body{overflow-x:hidden; max-width:100%}
body{
  margin:0; background:var(--ink); color:var(--cream);
  font-family:"Heebo",system-ui,"Segoe UI",Arial,sans-serif; font-weight:400;
  line-height:1.65; -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-3; pointer-events:none;
  background:
    radial-gradient(900px 520px at 88% -10%, rgba(23,71,89,.75), transparent 70%),
    radial-gradient(700px 460px at 4% 108%, rgba(95,212,180,.10), transparent 70%),
    linear-gradient(180deg,#061C25 0%,#08222D 55%,#061A22 100%);
}
body::after{
  content:""; position:fixed; inset:0; z-index:-2; pointer-events:none; opacity:.30;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:58px 58px; mask-image:radial-gradient(circle at 50% 30%,#000 30%,transparent 85%);
}
#bgfield{position:fixed; inset:0; z-index:-1; pointer-events:none}
a{color:var(--gold-soft)}
:focus-visible{outline:3px solid var(--vital); outline-offset:3px; border-radius:6px}
.ltr{direction:ltr; unicode-bidi:isolate; display:inline-block}
.skip{position:absolute; right:-9999px; top:8px; background:var(--gold); color:#10222b; padding:10px 18px; border-radius:8px; font-weight:700; z-index:99}
.skip:focus{right:12px}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 22px}

/* ---------- header ---------- */
header.top{position:sticky; top:0; z-index:40; backdrop-filter:blur(10px); background:rgba(6,26,34,.82); border-bottom:1px solid var(--line)}
.topbar{display:flex; align-items:center; gap:20px; justify-content:space-between; padding:11px 0; flex-wrap:wrap}
.brandmark{display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; flex:0 0 auto}
.klogo{display:block; width:auto; color:var(--cream)}
.brandlogo{height:46px; flex:0 0 auto}
.footlogo{height:40px; margin-bottom:10px; opacity:.85}
.brandmark b{font-weight:700; font-size:.98rem; letter-spacing:.2px}
.brandmark span{display:block; font-size:.74rem; color:var(--muted); font-weight:400}
nav.icons{display:flex; gap:8px; flex-wrap:wrap}
nav.icons a{
  display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--cream);
  padding:8px 14px; border-radius:11px; border:1px solid transparent; font-size:.92rem; font-weight:500;
  transition:background .18s, border-color .18s, color .18s;
}
nav.icons a svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none}
nav.icons a:hover{background:rgba(95,212,180,.09); border-color:rgba(95,212,180,.3)}
nav.icons a[aria-current="page"]{background:rgba(194,161,90,.15); border-color:rgba(194,161,90,.5); color:var(--gold-soft)}

/* ---------- home ---------- */
.home{padding:28px 0 0}
.herogrid{display:grid; grid-template-columns:minmax(0,1.12fr) minmax(290px,.88fr); gap:34px; align-items:center}
.hero h1{font-size:clamp(2rem,4.2vw,3.05rem); line-height:1.12; margin:0 0 .1em; font-weight:900; letter-spacing:-.5px}
.hero h1 .kicker{display:block; font-size:.36em; font-weight:500; color:var(--vital); letter-spacing:2px; margin-bottom:.7em}
.lede{color:var(--muted); max-width:52ch; margin:0 0 20px}

.console{border:1px solid rgba(95,212,180,.26); border-radius:var(--rad);
  background:linear-gradient(180deg,rgba(13,46,60,.92),rgba(9,34,45,.92));
  padding:16px 18px 14px; box-shadow:0 18px 40px rgba(0,0,0,.32)}
.console .screen{font-size:1.06rem; min-height:2.6em; display:flex; align-items:center; gap:.35em; flex-wrap:wrap}
.console .prompt{color:var(--gold); font-weight:700}
.caret{display:inline-block; width:10px; height:1.25em; background:var(--vital); vertical-align:-.22em; animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.keys{display:flex; flex-direction:column; gap:5px; margin-top:14px; padding-top:13px; border-top:1px dashed rgba(246,242,233,.16)}
.krow{display:flex; gap:5px; justify-content:center}
.key{font-family:"IBM Plex Mono","Heebo",monospace; font-size:.8rem; width:29px; height:29px;
  display:flex; align-items:center; justify-content:center; border-radius:6px;
  background:rgba(246,242,233,.05); border:1px solid rgba(246,242,233,.12); color:var(--muted);
  transition:transform .09s, background .22s, color .22s, box-shadow .22s}
.key.hit{background:var(--vital); color:#06222b; transform:translateY(2px); box-shadow:0 0 16px rgba(95,212,180,.55); border-color:var(--vital)}
.key:hover{background:var(--kc)!important; border-color:var(--kc)!important; color:#06222b!important; transform:translateY(-3px) scale(1.06); box-shadow:0 6px 18px rgba(0,0,0,.4)}
.key.space{width:150px}
.keys{cursor:crosshair}

.about{display:grid; grid-template-columns:118px minmax(0,1fr); gap:20px; align-items:center;
  border:1px solid var(--line); border-radius:var(--rad); padding:20px; background:rgba(13,46,60,.6)}
.about .portrait{width:118px; height:118px; border-radius:50%; background:var(--panel2);
  display:grid; place-items:center; border:2px solid var(--gold); box-shadow:0 0 0 6px rgba(194,161,90,.12); overflow:hidden}
.about .portrait img{width:100%; height:100%; object-fit:cover; display:block}
.about h2{margin:0 0 4px; font-size:1.22rem; font-weight:700}
.about .role{color:var(--vital); font-size:.92rem; margin:0 0 8px}
.about p{margin:0 0 8px; color:var(--muted); font-size:.95rem}
.about a{color:var(--gold-soft)}
.facts{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px}
.fact{border:1px solid var(--line); border-radius:11px; padding:11px 14px; background:rgba(9,34,45,.6); text-align:center}
.fact b{display:block; font-size:1.4rem; font-weight:900; color:var(--gold-soft); line-height:1.15}
.fact span{font-size:.79rem; color:var(--muted)}

/* full-width route map band */
.mapband{width:100vw; max-width:100vw; margin-inline:calc(50% - 50vw); margin-top:30px;
  border-top:1px solid rgba(194,161,90,.3); border-bottom:1px solid rgba(194,161,90,.3);
  background:linear-gradient(180deg,rgba(11,44,58,.9),rgba(7,32,43,.92)); padding:16px 0 10px}
.mapband .inner{max-width:1560px; margin:0 auto; padding:0 22px}
.mapband .bandhead{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; justify-content:space-between; margin-bottom:6px}
.mapband h2{margin:0; font-size:1.05rem; font-weight:700}
.mapband .legend{display:flex; gap:16px; flex-wrap:wrap; font-size:.79rem; color:var(--muted)}
.mapband .legend i{width:11px; height:11px; border-radius:50%; display:inline-block; margin-inline-end:6px; vertical-align:-1px}
.mapband svg{width:100%; height:auto}
.map-h{display:block}
.map-v{display:none}
.station{cursor:pointer}
.station .halo{opacity:0; transition:opacity .2s}
.station:hover .halo,.station:focus-visible .halo{opacity:1}
.station:focus-visible circle{stroke:var(--vital); stroke-width:3}

/* quick links strip */
.quick{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin:26px 0 6px}
.qcard{display:block; text-decoration:none; color:inherit; border:1px solid var(--line); border-radius:var(--rad);
  padding:16px 18px; background:rgba(13,46,60,.55); transition:border-color .18s, background .18s}
.qcard:hover{border-color:rgba(95,212,180,.45); background:rgba(95,212,180,.07)}
.qcard b{display:block; font-size:1.02rem; margin-bottom:3px}
.qcard span{font-size:.87rem; color:var(--muted)}

/* ---------- pages ---------- */
.page{padding:30px 0 20px}
.page h1{font-size:clamp(1.6rem,3vw,2.3rem); margin:0 0 6px; font-weight:900}
.page .sub{color:var(--muted); margin:0 0 26px; max-width:66ch}
.grid13{display:grid; grid-template-columns:repeat(auto-fill,minmax(238px,1fr)); gap:14px}
.lcard{border:1px solid var(--line); border-radius:var(--rad); background:linear-gradient(180deg,rgba(13,46,60,.8),rgba(9,32,42,.8));
  padding:15px 16px; display:flex; flex-direction:column; gap:8px; position:relative; overflow:hidden}
.lcard::before{content:""; position:absolute; inset-inline-start:0; top:0; bottom:0; width:3px; background:var(--gold); opacity:.55}
.lcard.soon::before{background:var(--muted); opacity:.3}
.lcard .num{font-family:"IBM Plex Mono",monospace; font-size:.78rem; color:var(--vital); letter-spacing:1px}
.lcard .date{font-family:"IBM Plex Mono",monospace; font-size:.86rem; color:var(--gold-soft)}
.lcard h3{margin:0; font-size:1.03rem; font-weight:700; line-height:1.35}
.lcard p{margin:0; color:var(--muted); font-size:.86rem; flex:1}
.btn{align-self:flex-start; display:inline-flex; align-items:center; gap:7px; text-decoration:none; font-size:.84rem; font-weight:700;
  padding:7px 15px; border-radius:9px; background:var(--gold); color:#0a2029; border:1px solid var(--gold); transition:filter .18s}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent; color:var(--muted); border-color:var(--line); cursor:not-allowed; font-weight:500}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* lesson detail */
.lesson{display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:30px; align-items:start}
.rail{position:sticky; top:82px; border:1px solid var(--line); border-radius:var(--rad); padding:14px; background:rgba(13,46,60,.62)}
.rail h2{margin:0 0 10px; font-size:.86rem; color:var(--vital); font-weight:700}
.rail a{display:block; text-decoration:none; color:var(--cream); font-size:.9rem; padding:7px 10px; border-radius:8px; border-inline-start:2px solid transparent}
.rail a:hover{background:rgba(95,212,180,.1); border-inline-start-color:var(--vital)}
.sec{border:1px solid var(--line); border-radius:var(--rad); padding:20px 22px; margin-bottom:16px; background:rgba(10,36,47,.6); scroll-margin-top:90px}
.sec h2{margin:0 0 6px; font-size:1.2rem; font-weight:700; color:var(--gold-soft)}
.sec h3{margin:16px 0 4px; font-size:1rem; font-weight:700}
.sec p,.sec li{color:#DCE7EB; font-size:.96rem}
.sec ul,.sec ol{margin:6px 0; padding-inline-start:22px}
.sec li{margin:4px 0}
/* view-only deck viewer */
.deck{border:1px solid rgba(194,161,90,.3); border-radius:var(--rad); background:linear-gradient(180deg,rgba(11,44,58,.9),rgba(8,33,44,.92)); overflow:hidden}
.deckhead{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:10px 14px; border-bottom:1px solid rgba(194,161,90,.22); background:rgba(194,161,90,.07)}
.deckhead b{font-size:.95rem; font-weight:700}
.deckhead .count{font-family:"IBM Plex Mono",monospace; font-size:.82rem; color:var(--gold-soft)}
.stage{position:relative; background:#05161D}
.stage img{display:block; width:100%; height:auto; user-select:none; -webkit-user-drag:none; pointer-events:none}
.navbtn{position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%;
  border:1px solid rgba(246,242,233,.25); background:rgba(6,26,34,.75); color:var(--cream);
  cursor:pointer; display:grid; place-items:center; backdrop-filter:blur(4px); transition:background .18s, opacity .18s}
.navbtn:hover{background:var(--gold); color:#0a2029; border-color:var(--gold)}
.navbtn[disabled]{opacity:.28; cursor:default}
.navbtn svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.navprev{inset-inline-start:12px}
.navnext{inset-inline-end:12px}
.deckbar{display:flex; align-items:center; gap:10px; padding:9px 14px; border-top:1px solid rgba(246,242,233,.1); flex-wrap:wrap}
.dots{display:flex; gap:6px; flex-wrap:wrap; flex:1}
.dot{width:26px; height:6px; border-radius:3px; border:none; background:rgba(246,242,233,.18); cursor:pointer; padding:0; transition:background .18s}
.dot:hover{background:rgba(95,212,180,.5)}
.dot[aria-current="true"]{background:var(--gold)}
.fsbtn{font-family:inherit; font-size:.8rem; font-weight:700; color:#06222b; background:var(--vital);
  border:none; border-radius:8px; padding:6px 13px; cursor:pointer}
.deck:fullscreen{background:#05161D; display:flex; flex-direction:column; justify-content:center}
.deck:fullscreen .stage img{max-height:88vh; width:auto; margin:0 auto}
.deck:fullscreen .stage{display:flex; justify-content:center}
.tbl{width:100%; border-collapse:collapse; margin:10px 0; font-size:.93rem}
.tbl th,.tbl td{border:1px solid var(--line); padding:6px 10px; text-align:start}
.tbl th{background:rgba(194,161,90,.12); color:var(--gold-soft); font-weight:700; font-size:.88rem}
.tbl td.k{font-family:"IBM Plex Mono",monospace; direction:ltr; text-align:center; color:var(--vital); white-space:nowrap; width:130px}
.tbl tr:nth-child(even) td{background:rgba(246,242,233,.03)}
.tip{border-inline-start:3px solid var(--vital); background:rgba(95,212,180,.08); padding:10px 14px; border-radius:8px; margin:12px 0; font-size:.93rem}
code{font-family:"IBM Plex Mono",monospace; background:rgba(246,242,233,.08); padding:2px 7px; border-radius:5px; font-size:.9em; direction:ltr; display:inline-block}
/* interactive lab */
.lab{border:1px solid var(--line); border-radius:var(--rad); background:rgba(10,36,47,.68); padding:20px 22px; margin-bottom:16px}
.lab h3{margin:0 0 4px; font-size:1.08rem; font-weight:700}
.lab .why{color:var(--muted); font-size:.9rem; margin:0 0 14px}
.labgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(285px,1fr)); gap:16px; align-items:start}
.tag{font-family:"IBM Plex Mono",monospace; font-size:.76rem; color:var(--vital); border:1px solid rgba(95,212,180,.4);
  border-radius:6px; padding:2px 8px; direction:ltr; display:inline-block; margin-inline-start:8px}
label.fl{display:block; font-size:.84rem; color:var(--muted); margin:0 0 5px}
input[type=text],input[type=date],input[type=tel],input[type=email]{
  width:100%; font-family:inherit; font-size:.95rem; color:var(--cream); background:rgba(6,26,34,.75);
  border:1px solid var(--line); border-radius:9px; padding:9px 12px}
input:focus{border-color:var(--vital); outline:none; box-shadow:0 0 0 3px rgba(95,212,180,.2)}
.field{margin-bottom:11px}
.readout{background:rgba(6,26,34,.75); border:1px solid var(--line); border-radius:9px; padding:10px 14px; text-align:center}
.readout span{display:block; font-size:.76rem; color:var(--muted)}
.readout strong{font-size:1.15rem; color:var(--gold-soft)}
.fx{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:11px;
  background:#05161D; border:1px solid rgba(95,212,180,.24); border-radius:9px; padding:9px 12px}
.fx code{background:none; color:var(--vital); padding:0; font-size:.92rem}
.mini{font-family:inherit; font-size:.79rem; font-weight:700; color:#06222b; background:var(--vital);
  border:none; border-radius:7px; padding:5px 11px; cursor:pointer; flex:none}
.mini:hover{filter:brightness(1.08)}
.say{font-size:.85rem; color:var(--vital); min-height:1.2em; margin:8px 0 0}
.labtip{border-inline-start:3px solid var(--gold); background:rgba(194,161,90,.09); padding:9px 13px; border-radius:8px; margin-top:12px; font-size:.88rem; color:#DCE7EB}
.sigwrap{background:#FFFFFF; border-radius:11px; padding:18px 20px; color:#1d2b31; direction:rtl; font-family:Arial,"Heebo",sans-serif}
.sigwrap .greet{font-size:13px; color:#5a6b73; margin:0 0 6px}
.sigwrap .nm{font-size:17px; font-weight:700; color:#12303d; margin:0}
.sigwrap .rl{font-size:13px; color:#17758a; font-weight:600; margin:2px 0 0}
.sigwrap .og{font-size:12.5px; color:#5a6b73; margin:2px 0 0}
.sigwrap .cn{font-size:12.5px; color:#5a6b73; margin:2px 0 0}
.sigwrap .cn a{color:#17758a; text-decoration:none}
.sigwrap .gr{font-size:11.5px; color:#2f7d5b; margin:10px 0 0; padding-top:8px; border-top:1px solid #e4eaec}
.sigwrap .bar{height:3px; width:52px; background:#C2A15A; border-radius:2px; margin:0 0 9px}
.chk{display:flex; align-items:center; gap:8px; font-size:.87rem; color:var(--muted); margin:4px 0 12px; cursor:pointer}
.chk input{width:17px; height:17px; accent-color:#5FD4B4}
.toolsec{font-size:1rem; font-weight:700; color:var(--vital); margin:26px 0 10px}
.toolsec:first-of-type{margin-top:0}
.lcard.tool::before{background:var(--vital); opacity:.6}
.lcard.tool .num{color:var(--gold-soft); font-size:.95rem; font-weight:500; letter-spacing:.3px}
.hw{border:1px solid var(--line); border-radius:var(--rad); padding:18px 20px; margin-bottom:14px; background:rgba(10,36,47,.6)}
.hw header{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:6px}
.hw header h2{margin:0; font-size:1.08rem}
.hw header .date{font-family:"IBM Plex Mono",monospace; font-size:.82rem; color:var(--gold-soft)}
.hw ul{margin:8px 0 0; padding-inline-start:22px; color:#DCE7EB; font-size:.95rem}
.empty{border:1px dashed var(--line); border-radius:var(--rad); padding:22px; color:var(--muted); text-align:center}

/* pulse divider */
.ecgwrap{margin:26px 0 0; cursor:crosshair; border-radius:10px; transition:background .25s}
.ecgwrap:hover{background:rgba(95,212,180,.05)}
.ecgwrap .cap{font-size:.78rem; color:var(--muted); margin:0 0 2px; opacity:.7; transition:opacity .25s, color .25s}
.ecgwrap:hover .cap{opacity:1; color:var(--vital)}
.pulse{width:100%; height:56px; display:block; opacity:.55; transition:opacity .25s}
.pulse .trace{fill:none; stroke:var(--vital); stroke-width:1.6; stroke-dasharray:1100; stroke-dashoffset:1100; animation:trace 7s linear infinite}
.pulse .blip{fill:var(--vital); opacity:0; transition:opacity .2s}
.ecgwrap:hover .pulse{opacity:1}
.ecgwrap:hover .trace{stroke-dasharray:none; stroke-dashoffset:0; animation:none; stroke-width:2.2; filter:drop-shadow(0 0 7px rgba(95,212,180,.65))}
.ecgwrap:hover .blip{opacity:1}
@keyframes trace{to{stroke-dashoffset:-1100}}

/* footer + a11y */
footer.site{border-top:1px solid var(--line); margin-top:40px; padding:22px 0 40px; color:var(--muted); font-size:.86rem}
footer.site .row{display:flex; gap:16px; justify-content:space-between; flex-wrap:wrap}
.a11ybtn{position:fixed; inset-inline-start:16px; bottom:16px; z-index:50; width:50px; height:50px; border-radius:50%;
  background:var(--gold); color:#0a2029; border:none; cursor:pointer; display:grid; place-items:center; box-shadow:0 10px 26px rgba(0,0,0,.45)}
.a11ybtn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.panel{position:fixed; inset-inline-start:16px; bottom:78px; z-index:51; width:290px; background:var(--panel); border:1px solid rgba(194,161,90,.4);
  border-radius:var(--rad); padding:16px; display:none; box-shadow:0 18px 50px rgba(0,0,0,.55)}
.panel[data-open="true"]{display:block}
.panel h2{margin:0 0 10px; font-size:1rem}
.panel .opt{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:.9rem}
.panel .opt:last-of-type{border-bottom:none}
.panel button.sm{background:rgba(246,242,233,.08); color:var(--cream); border:1px solid var(--line); border-radius:7px; padding:4px 11px; cursor:pointer; font-family:inherit; font-size:.85rem}
.panel button.sm[aria-pressed="true"]{background:var(--vital); color:#06222b; border-color:var(--vital); font-weight:700}

/* accessibility modes */
body.hc{--muted:#D8E6EA; --cream:#FFFFFF; --line:rgba(255,255,255,.4); --ink:#000508}
body.hc .sec,body.hc .lcard,body.hc .about{background:#04161d}
body.links a{text-decoration:underline!important}
body.nomotion *,body.nomotion *::before,body.nomotion *::after{animation:none!important; transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

@media (max-width:860px){
  .herogrid{grid-template-columns:1fr}
  .map-h{display:none}
  .map-v{display:block}
  .lesson{grid-template-columns:1fr}

function deckViewer(){
  return `<div class="deck" id="deck">
    <div class="deckhead"><b>מהלימודים לעבודה — מצגת השיעור</b><span class="count" id="dkCount">1 / ${DECK4.length}</span></div>
    <div class="stage">
      <img id="dkImg" src="${DECK4[0]}" alt="שקף 1 מתוך ${DECK4.length}" draggable="false" oncontextmenu="return false">
      <button class="navbtn navprev" id="dkPrev" aria-label="השקף הקודם" disabled><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="navbtn navnext" id="dkNext" aria-label="השקף הבא"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    </div>
    <div class="deckbar">
      <div class="dots" id="dkDots" role="tablist" aria-label="מעבר לשקף">
        ${DECK4.map((_,i)=>`<button class="dot" role="tab" data-i="${i}" aria-current="${i===0}" aria-label="שקף ${i+1}"></button>`).join('')}
      </div>
      <button class="fsbtn" id="dkFs">מסך מלא</button>
    </div>
  </div>`;
}
function wireDeck(){
  const box=document.getElementById('deck'); if(!box) return;
  const img=document.getElementById('dkImg'), cnt=document.getElementById('dkCount');
  const prev=document.getElementById('dkPrev'), next=document.getElementById('dkNext');
  const dots=[...box.querySelectorAll('.dot')];
  let i=0;
  const show=n=>{
    i=Math.max(0,Math.min(DECK4.length-1,n));
    img.src=DECK4[i]; img.alt='שקף '+(i+1)+' מתוך '+DECK4.length;
    cnt.textContent=(i+1)+' / '+DECK4.length;
    prev.disabled=i===0; next.disabled=i===DECK4.length-1;
    dots.forEach((d,k)=>d.setAttribute('aria-current',k===i));
  };
  prev.addEventListener('click',()=>show(i-1));
  next.addEventListener('click',()=>show(i+1));
  dots.forEach(d=>d.addEventListener('click',()=>show(+d.dataset.i)));
  box.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'){ show(i+1); e.preventDefault(); }
    if(e.key==='ArrowRight'){ show(i-1); e.preventDefault(); }
  });
  box.tabIndex=0;
  document.getElementById('dkFs').addEventListener('click',()=>{
    if(document.fullscreenElement) document.exitFullscreen();
    else box.requestFullscreen&&box.requestFullscreen();
  });
  // preload the neighbours so paging feels instant
  DECK4.forEach(src=>{ const im=new Image(); im.src=src; });
}

        <table class="tbl"><thead><tr><th>קיצור</th><th>מה הוא עושה</th></tr></thead><tbody><tr><td class="k">CTRL+X</td><td>גזירה</td></tr><tr><td class="k">CTRL+C</td><td>העתקה</td></tr><tr><td class="k">CTRL+V</td><td>הדבקה</td></tr><tr><td class="k">CTRL+S</td><td>שמירה</td></tr><tr><td class="k">CTRL+Z</td><td>ביטול הפעולה האחרונה</td></tr><tr><td class="k">CTRL+Y</td><td>ביטול ה-CTRL+Z</td></tr><tr><td class="k">CTRL+P</td><td>הדפסה</td></tr><tr><td class="k">CTRL+A</td><td>בחירת כל התוכן</td></tr><tr><td class="k">CTRL+F</td><td>חיפוש בטקסט</td></tr><tr><td class="k">CTRL+W</td><td>סגירת כרטיסייה</td></tr><tr><td class="k">CTRL+B</td><td>הדגשת טקסט מסומן</td></tr><tr><td class="k">CTRL+I</td><td>הטיית טקסט מסומן</td></tr><tr><td class="k">CTRL+U</td><td>קו תחתון לטקסט מסומן</td></tr><tr><td class="k">CTRL+R</td><td>רענון דף האינטרנט</td></tr><tr><td class="k">CTRL+T</td><td>פתיחת כרטיסיית אינטרנט חדשה</td></tr><tr><td class="k">CTRL+N</td><td>פתיחת חלון חדש</td></tr><tr><td class="k">ALT+TAB</td><td>החלפת חלונות</td></tr><tr><td class="k">ALT+F4</td><td>סגירת המסמך הפעיל</td></tr><tr><td class="k">Shift+Delete</td><td>מחיקה לצמיתות</td></tr><tr><td class="k">Delete</td><td>מחיקה לסל המיחזור</td></tr></tbody></table>
        <div class="tip">CTRL+S אחרי כל שינוי משמעותי. זה הקיצור היחיד שמציל מסמך שלם.</div>`},
      { id:"folders", h:"סדר בתיקיות — לפני הכול", html:`
        <p>לפני יצירת הקובץ הראשון כדאי לבנות את המקום שבו הוא יישמר.</p>
        <ol>
          <li>לחיצה ימנית על שולחן העבודה ← חדש ← תיקייה, ולתת שם: ״תוכנת Word״.</li>
          <li>בתוכה תת-תיקייה לכל נושא, כדי שהתרגילים לא יתערבבו.</li>
          <li>לפתוח מסמך Word חדש ולשמור אותו ישר לתוך התיקייה הנכונה.</li>
        </ol>`},
      { id:"ex1", h:"תרגיל 1 — שאלון לנוסע", html:`
        <p>טופס קליטה למרפאת מטיילים: כותרת מעוצבת, פרטי הנוסע, שאלות סינון וחתימה.</p>
        <h3>מסלול הפעולות</h3>
        <ul>
          <li><b>גבולות עמוד</b> — לשונית עיצוב (מגרסה 2013 ומעלה) ← חלונית רקע עמוד ← גבולות עמוד.</li>
          <li><b>תמונה מקוונת</b> — לשונית הוספה ← חלונית איורים ← תמונות ← תמונות מקוונות.</li>
          <li><b>כותרת עליונה מעוצבת ב-WordArt</b> — לשונית הוספה ← חלונית טקסט ← WordArt, או דרך כותרת עליונה/תחתונה.</li>
          <li><b>תיבת טקסט</b> — לשונית הוספה ← חלונית טקסט ← תיבת טקסט ← תיבת טקסט פשוטה.</li>
          <li><b>הצגת לשונית מפתחים</b> — לשונית קובץ ← אפשרויות ← התאמה אישית של רצועת הכלים ← סימון V ליד ״מפתחים״.</li>
          <li><b>פקד תאריך</b> — לשונית מפתחים ← חלונית פקדים ← פקד תוכן של בורר תאריכים.</li>
          <li><b>תיבת סימון</b> — לשונית מפתחים ← חלונית פקדים ← פקד תוכן של תיבת סימון.</li>
          <li><b>שורת חתימה</b> — לשונית הוספה ← חלונית טקסט ← שורת חתימה.</li>
        </ul>
        <div class="tip">פקדים הם מה שהופך מסמך לטופס אמיתי: מי שממלא בוחר תאריך מלוח שנה ומסמן תיבות, במקום להקליד על קו.</div>`},
      { id:"ex2", h:"תרגיל 2 — טופס שחרור", html:`
        <p>מסמך רשמי של מחלקה: פרטי החולה בשני טורים, אבחנה והמלצות בשחרור, חתימת הרופא וסימן מים.</p>
        <h3>מסלול הפעולות</h3>
        <ul>
          <li><b>גבולות עמוד</b> — לשונית עיצוב ← חלונית רקע עמוד ← גבולות עמוד.</li>
          <li><b>טבלה לכותרת</b> — שורה אחת, שלוש עמודות, ואז עיצוב טבלה ללא גבולות: לשונית הוספה ← חלונית טבלאות ← הוספת טבלה.</li>
          <li><b>פיצול לשני טורים</b> — קודם להקליד את הטקסט כולו, ורק אז לסמן את החלק של פרטי החולה (שש שורות) ← לשונית פריסה ← חלונית הגדרת עמוד ← טורים ← טורים נוספים.</li>
          <li><b>טבלת האבחנה וההמלצות</b> — 14 שורות, עמודה אחת: לשונית הוספה ← חלונית טבלאות ← הוספת טבלה.</li>
          <li><b>שורת חתימה</b> — לשונית הוספה ← חלונית טקסט ← שורת חתימה.</li>
          <li><b>סימן מים</b> — לשונית עיצוב ← חלונית רקע עמוד ← סימן מים ← סימן מים מותאם אישית, ולכתוב את שם המוסד.</li>
        </ul>
        <div class="tip">סדר העבודה חשוב: קודם כל הטקסט, ורק אחר כך הפיצול לטורים. פיצול על מסמך ריק מתפרק ברגע שמתחילה ההקלדה.</div>`},
      { id:"pdf", h:"שמירת הקובץ כ-PDF", html:`
        <p>קובץ Word נשלח לעריכה, קובץ PDF נשלח לקריאה — הוא נראה אותו דבר בכל מחשב ואי אפשר לשנות אותו בטעות.</p>
        <ol>
          <li>קובץ ← שמור בשם ← עיון.</li>
          <li>בחירת המיקום הרצוי בתוך התיקייה שבנינו.</li>
          <li>שינוי ״סוג הקובץ״ ל-PDF ולחיצה על שמור.</li>
        </ol>
        <div class="tip">כדאי לשמור תמיד את שתי הגרסאות: את ה-Word לעריכות עתידיות ואת ה-PDF למשלוח.</div>`}
    ]
  },
  { n:3, date:"12/10/2026", title:"Gemini — בניית טפסים ותוצרים עם AI", brief:"ניסוח פרומפט מדויק, בניית שני הטפסים מהשיעור הקודם בעזרת Gemini, שיתוף השיחה, סטיקרים וג׳ינגל למרפאה.", ready:true,
    homework:[

    sections:[
      { id:"prompt", h:"איך מנסחים פרומפט שמחזיר תוצאה", html:`
        <p>Gemini לא מנחש מה רוצים ממנו. ככל שהבקשה מדויקת יותר, כך פחות סבבי תיקון.</p>
        <h3>מבנה של בקשה טובה</h3>
        <ul>
          <li><b>מה לבנות</b> — ״צור טופס קליטה למרפאת מטיילים: כותרת מעוצבת, פרטי הנוסע, שאלות סינון וחתימה״.</li>
          <li><b>מסלול הפעולות</b> — אפשר להדביק את רשימת הצעדים מהשיעור הקודם, והמודל בונה לפיה.</li>
          <li><b>דרישות עיצוב</b> — עברית, יישור לימין (RTL), לוגו, שם המרפאה, כתובת, טלפון ומייל.</li>
          <li><b>פורמט התוצר</b> — קובץ HTML או Word יחיד, מוכן להדפסה.</li>
        </ul>
        <h3>לתקן בשלבים</h3>
        <p>התוצאה הראשונה כמעט אף פעם לא מושלמת. ממשיכים באותה שיחה, תיקון אחד בכל פעם:</p>
        <ul>
          <li>״הסר את ההנחיות״ — שיישאר הטופס בלבד, בלי ההסברים שסביבו.</li>
          <li>״הטופס צריך להיות ללא נתונים של מטופל, רק ריק כדי שהרופא ימלא״.</li>
          <li>״ללא רקע תכלת״, ״שלב את שם המרפאה והלוגו״, ״הקפד על RTL״.</li>
        </ul>
        <div class="tip">התוצר של Gemini הוא נקודת פתיחה, לא מוצר מוגמר. הבדיקה והאחריות על התוכן הרפואי נשארות אצל מי שמוציא את הטופס.</div>`},
      { id:"canvas", h:"Canvas — לראות את התוצר ולהוריד אותו", html:`
        <p>כשהתשובה היא מסמך או דף שלם, Gemini פותח אותו בלשונית <b>Canvas</b> לצד השיחה.</p>
        <ul>
          <li><b>תצוגה מקדימה</b> — איך הטופס ייראה בפועל.</li>
          <li><b>קוד</b> — ה-HTML עצמו, להעתקה.</li>
          <li><b>הורדה</b> — שמירת הקובץ למחשב.</li>
          <li><b>הדפס / שמור כ-PDF</b> — מתוך הטופס עצמו, להגשה או לתיוק.</li>
        </ul>
        <div class="tip">קובץ HTML אפשר גם לפתוח ב-Word ולהמשיך לערוך אותו ידנית, בדיוק כמו כל מסמך.</div>`},
      { id:"ex1g", h:"תרגיל 1 — שאלון קליטה למרפאת מטיילים", html:`
        <p>אותו טופס שנבנה ידנית ב-Word בשיעור הקודם, הפעם בבקשה אחת מ-Gemini.</p>
        <ul>
          <li>פרטי המרפאה בראש הדף: שם, כתובת, טלפון, פקס, מייל ואתר.</li>
          <li>פרטים אישיים: שם מלא, ת.ז./דרכון, תאריך לידה, מין, קופת חולים, טלפון ומייל.</li>
          <li>פרטי הנסיעה: תאריך יציאה, משך, מדינות היעד ואופי הטיול.</li>
          <li>שאלון סינון רפואי בטבלת כן/לא.</li>
          <li>הצהרה ושורת חתימה בתחתית.</li>
        </ul>`},
      { id:"ex2g", h:"תרגיל 2 — טופס שחרור רפואי", html:`
        <p>תבנית ריקה שהרופא ממלא ביד או במחשב — בלי נתוני דמה.</p>
        <ul>
          <li>כותרת: שם המרכז הרפואי, לוגו, פרטי קשר ושם המחלקה.</li>
          <li>פרטי המטופל: שם, ת.ז., תאריך לידה, תאריך קבלה ותאריך שחרור.</li>
          <li>אבחנה, סיכום קליני והמלצות בשחרור — שורות ריקות למילוי.</li>
          <li>שם הרופא ושורת חתימה.</li>
        </ul>
        <div class="tip">כשמבקשים טופס להדפסה כדאי לציין ״שורות ריקות למילוי בכתב יד״ — אחרת המודל ממלא אותן בתוכן לדוגמה.</div>`},
      { id:"share", h:"שיתוף השיחה", html:`
        <p>אפשר לשתף את השיחה עצמה, כדי שאחרים יראו את הפרומפטים ואת הדרך לתוצאה.</p>
        <ol>
          <li>בתפריט השיחה בוחרים שיתוף.</li>
          <li>Gemini יוצר קישור ציבורי בכתובת <span class="ltr">share.gemini.google</span>.</li>
          <li>מעתיקים את הקישור ושולחים.</li>
        </ol>
        <div class="tip">קישור שיתוף חושף את כל השיחה. לא משתפים שיחה שיש בה פרטים אמיתיים של מטופלים.</div>`},
      { id:"media", h:"סטיקרים, תמונות וג׳ינגל למרפאה", html:`
        <p>אותה שיחה יודעת לייצר גם חומרים ויזואליים ושמע — לדף הפייסבוק או למסכים במרפאה.</p>
        <h3>סטיקר או תמונה</h3>
        <ul>
          <li>מבקשים סטיקר בנושא ועם המסר: ״טוסו, תהנו, ואנחנו כאן בשבילכם למקרה הצורך״.</li>
          <li>מתקנים בשלבים: ״שלב את שם המרפאה״, ״צבעים של המרפאה״, ״ללא רקע תכלת״, ״שלב את הלוגו״.</li>
          <li>מורידים בגודל מלא, ואפשר לבקש רקע שקוף.</li>
        </ul>
        <h3>ג׳ינגל או טראק</h3>
        <ul>
          <li>מבקשים ג׳ינגל מקצועי למרכז הרפואי, ומציינים סגנון ואווירה.</li>
          <li>אפשר לבקש גרסה קצרה להמתנה בטלפון וגרסה ארוכה לרשתות.</li>
        </ul>
        <div class="tip">תוצרי AI שמיועדים לפרסום — לפני העלאה בודקים שהטקסט בעברית נכתב נכון ושהלוגו לא עוות.</div>`},
      { id:"upload", h:"הגשת התוצרים", html:`
        <p>כל התוצרים של השיעור עולים לתיקייה המשותפת בדרייב:</p>
        <p><a href="https://drive.google.com/drive/folders/1qB2EqAek_W206gIdAoQmZtYxGdEvAWwF?usp=sharing" target="_blank" rel="noopener">תיקיית ההגשות של הקורס</a></p>
        <div class="tip">שם קובץ ברור חוסך בלבול: ״שאלון מטיילים — שם פרטי ושם משפחה״.</div>`}
    ]
  },
  { n:4, date:"26/10/2026", title:"PowerPoint — בניית מצגת ״מהלימודים לעבודה״", brief:"שלד המצגת, ערכת גופנים אישית, צורות והיפר-קישורים פנימיים, כותרת תחתונה, מעצב, מעברים והנפשות.", ready:true,
    homework:[

    sections:[
      { id:"skeleton", h:"שלד המצגת — קודם כותרות, אחר כך תוכן", html:`
        <p>מצגת מתחילה מהשלד: קובעים מראש כמה שקפים יהיו ומה הכותרת של כל אחד, ורק אז ממלאים תוכן. ככה לא מתפזרים באמצע.</p>
        <table class="tbl"><thead><tr><th>שקף</th><th>כותרת</th></tr></thead><tbody><tr><td class="k">1</td><td>מהלימודים לעבודה — שקף הפתיחה</td></tr><tr><td class="k">2</td><td>מהלימודים לעבודה — תוכן העניינים</td></tr><tr><td class="k">3</td><td>סיימתי את הקורס — מה עכשיו?</td></tr><tr><td class="k">4</td><td>איפה אפשר לעבוד?</td></tr><tr><td class="k">5</td><td>אלו מילות חיפוש כדאי לנסות?</td></tr><tr><td class="k">6</td><td>איפה מחפשים משרות?</td></tr><tr><td class="k">7</td><td>בדקו גם באתרי המעסיקים</td></tr><tr><td class="k">8</td><td>אין לי ניסיון — איך מתחילים?</td></tr><tr><td class="k">9</td><td>קורות חיים: מה חשוב להציג?</td></tr><tr><td class="k">10</td><td>מתכוננים לראיון עבודה</td></tr><tr><td class="k">11</td><td>איך הבינה המלאכותית יכולה לעזור?</td></tr><tr><td class="k">12</td><td>קישורים שימושיים להמשך</td></tr><tr><td class="k">13</td><td>בהצלחה</td></tr></tbody></table>
        <div class="tip">השקף השני הוא תוכן העניינים — אליו יחזרו כל הקישורים הפנימיים בהמשך השיעור.</div>`},
      { id:"fonts", h:"ערכת גופנים אישית", html:`
        <p>במקום לשנות גופן בכל שקף בנפרד, מגדירים ערכה אחת שחלה על המצגת כולה.</p>
        <h3>שינוי הגופן בכל המצגת</h3>
        <ul>
          <li>לשונית עיצוב ← חלונית משתנים ← <b>גופנים</b> ← בחירת ערכה.</li>
        </ul>
        <h3>יצירת ערכת גופנים חדשה</h3>
        <ol>
          <li>עיצוב ← משתנים ← גופנים ← <b>התאמה אישית של גופנים</b>.</li>
          <li>בחלון נפתחים ארבעה שדות: גופן כותרת וגופן גוף — ללטינית, ולעברית ושפות אחרות.</li>

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const doneCount = () => LESSONS.filter(l=>l.ready).length;

/* ---------- route map ---------- */
function mapPoints(W,H,horizontal){
  const n=LESSONS.length, pts=[];
  for(let k=0;k<n;k++){
    const t=n>1?k/(n-1):0;
    if(horizontal){
      const x=W-70-t*(W-140);                    // מימין לשמאל
      const y=H/2+ (H*0.26)*Math.sin(t*Math.PI*2.7);
      pts.push([Math.round(x),Math.round(y)]);
    }else{
      const y=H-70-t*(H-150);
      const x=190+120*Math.sin(t*Math.PI*3.1)*(0.55+0.45*Math.cos(t*2.2));
      pts.push([Math.round(x),Math.round(y)]);
    }
  }
  return pts;
}
function smoothPath(pts,horizontal){
  let d=`M ${pts[0][0]} ${pts[0][1]}`;
  for(let k=1;k<pts.length;k++){
    const [px,py]=pts[k-1],[cx,cy]=pts[k];
    if(horizontal){ const mx=(px+cx)/2; d+=` C ${mx} ${py}, ${mx} ${cy}, ${cx} ${cy}`; }
    else{ const my=(py+cy)/2; d+=` C ${px} ${my}, ${cx} ${my}, ${cx} ${cy}`; }
  }
  return d;
}
function stationsSVG(pts,horizontal){
  const cur=doneCount()-1;
  return pts.map((p,k)=>{
    const l=LESSONS[k], done=l.ready, here=k===cur&&done;
    const target=done?'#/lesson/'+l.n:'#/lessons';
    const r=horizontal?15:11, fs=horizontal?13:11;
    const below=horizontal&&p[1]<150;
    const ly=horizontal?(below?p[1]-r-12:p[1]+r+20):p[1]-14;
    const label=l.date||('שיעור '+l.n);
    return `<g class="station" tabindex="0" role="link" aria-label="שיעור ${l.n}${l.title?': '+esc(l.title):''}"
        onclick="go('${target}')" onkeydown="if(event.key==='Enter')go('${target}')">
      <circle class="halo" cx="${p[0]}" cy="${p[1]}" r="${r+7}" fill="${done?'#C2A15A':'#5FD4B4'}"/>
      <circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${done?'#C2A15A':'#0C3546'}" stroke="${done?'#E0C68B':'rgba(246,242,233,.42)'}" stroke-width="2"/>
      <text x="${p[0]}" y="${p[1]+fs*0.35}" text-anchor="middle" font-size="${fs}" font-family="IBM Plex Mono, monospace" fill="${done?'#08222d':'#9DB6C0'}">${l.n}</text>
      ${horizontal?`<text x="${p[0]}" y="${ly}" text-anchor="middle" font-size="11" fill="${done?'#E0C68B':'rgba(157,182,192,.75)'}" font-family="IBM Plex Mono, monospace">${esc(label)}</text>`:''}
      ${here?`<circle cx="${p[0]}" cy="${p[1]}" r="${r+8}" fill="none" stroke="#5FD4B4" stroke-width="1.6"/>
        <text x="${p[0]}" y="${horizontal?(below?ly-16:ly+16):p[1]-30}" text-anchor="middle" font-size="12" fill="#5FD4B4" font-weight="700">אנחנו כאן</text>`:''}
    </g>`;
  }).join('');
}
function mapSVG(horizontal){
  const W=horizontal?1560:380, H=horizontal?330:830;
  const pts=mapPoints(W,H,horizontal), d=smoothPath(pts,horizontal);
  const grid = horizontal
    ? Array.from({length:9},(_,k)=>`<line x1="0" y1="${k*40}" x2="${W}" y2="${k*40}"/>`).join('')+
      Array.from({length:16},(_,k)=>`<line x1="${k*104}" y1="0" x2="${k*104}" y2="${H}"/>`).join('')
    : Array.from({length:8},(_,k)=>`<line x1="0" y1="${k*110+40}" x2="${W}" y2="${k*110+40}"/>`).join('')+
      Array.from({length:4},(_,k)=>`<line x1="${k*95+45}" y1="0" x2="${k*95+45}" y2="${H}"/>`).join('');
  const contours = horizontal
    ? `<path d="M60 46 q160 -34 300 4 t320 -10 t300 16 t260 -8"/>
       <path d="M40 22 q170 -30 320 8 t330 -12 t300 18 t280 -6"/>
       <path d="M80 296 q180 32 330 -6 t320 12 t300 -16 t250 8"/>
       <path d="M60 318 q190 30 340 -8 t330 14 t300 -14 t230 6"/>`
    : `<path d="M30 640 q70 -40 130 -8 t120 -30"/><path d="M20 610 q80 -52 150 -12 t140 -36"/>
       <path d="M40 250 q90 40 150 6 t120 26"/><path d="M30 215 q100 48 165 10 t140 30"/>`;
  const compass = horizontal
    ? `<g transform="translate(${W-44},44)" opacity=".75"><circle r="20" fill="none" stroke="rgba(194,161,90,.5)"/><path d="M0 -17 L5 0 L0 17 L-5 0 Z" fill="#C2A15A"/><text x="0" y="-24" text-anchor="middle" font-size="9" fill="#C2A15A">צ</text></g>`
    : `<g transform="translate(52,56)" opacity=".8"><circle r="24" fill="none" stroke="rgba(194,161,90,.5)"/><path d="M0 -21 L6 0 L0 21 L-6 0 Z" fill="#C2A15A"/><text x="0" y="-28" text-anchor="middle" font-size="10" fill="#C2A15A">צ</text></g>`;
  return `<svg class="${horizontal?'map-h':'map-v'}" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="מפת מסלול הקורס: ${COURSE.total} תחנות, ${doneCount()} מהן כבר נלמדו">
    <defs><pattern id="hatch${horizontal?'H':'V'}" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="rgba(246,242,233,.05)" stroke-width="1"/></pattern></defs>
    <rect width="${W}" height="${H}" fill="url(#hatch${horizontal?'H':'V'})"/>
    <g stroke="rgba(246,242,233,.06)" stroke-width="1">${grid}</g>
    <g fill="none" stroke="rgba(95,212,180,.13)" stroke-width="1.4">${contours}</g>
    ${compass}
    <path d="${d}" fill="none" stroke="rgba(246,242,233,.15)" stroke-width="${horizontal?16:13}" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="#C2A15A" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="9 9" opacity=".85"/>
    ${stationsSVG(pts,horizontal)}
  </svg>`;
}
function routeMap(){
  return `<section class="mapband" aria-labelledby="maptitle"><div class="inner">
    <div class="bandhead">
      <h2 id="maptitle">מפת המסלול — ${doneCount()} מתוך ${COURSE.total}</h2>
      <div class="legend">
        <span><i style="background:#C2A15A"></i>נלמד</span>
        <span><i style="background:#0C3546;border:1px solid rgba(246,242,233,.42)"></i>לפנינו</span>
        <span><i style="background:#5FD4B4"></i>התחנה הנוכחית</span>
      </div>
    </div>
    ${mapSVG(true)}
    ${mapSVG(false)}
  </div></section>`;
}

function pageLessons(){
  return `<div class="page">
    <h1>השיעורים</h1>
    <p class="sub">13 מפגשים. כל שיעור נפתח בחלון משלו עם הסיכום, הצעדים והתרגול.</p>
    <div class="grid13">${LESSONS.map(l=>`
      <article class="lcard ${l.ready?'':'soon'}">
        <span class="num">שיעור ${l.n}</span>
        <span class="date">${l.date||'תאריך ייקבע'}</span>
        <h3>${l.title?esc(l.title):'נושא ייעודכן'}</h3>
        <p>${l.brief?esc(l.brief):''}</p>
        ${l.ready
          ? `<a class="btn" href="#/lesson/${l.n}">לשיעור <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></a>`
          : `<span class="btn ghost" aria-disabled="true">בקרוב</span>`}
      </article>`).join('')}
    </div>
  </div>`;
}

function pageLesson(n){
  const l=LESSONS.find(x=>x.n===Number(n));
  if(!l||!l.ready) return `<div class="page"><h1>השיעור עדיין לא פורסם</h1><p class="sub">החומרים יעלו לכאן אחרי המפגש. <a href="#/lessons">חזרה לרשימת השיעורים</a></p></div>`;
  return `<div class="page">
    <h1>שיעור ${l.n} — ${esc(l.title)}</h1>
    <p class="sub">${esc(l.date)} · ${esc(l.brief)}</p>
    <div class="lesson">
      <div>${l.sections.map(s=>`<section class="sec" id="${s.id}"><h2>${esc(s.h)}</h2>${s.html}</section>`).join('')}</div>
      <nav class="rail" aria-label="נושאי השיעור">
        <h2>בשיעור הזה</h2>
        ${l.sections.map(s=>`<a href="#${s.id}">${esc(s.h)}</a>`).join('')}
        <a href="#/homework" style="margin-top:10px;color:var(--gold-soft)">שיעורי הבית ←</a>
        <a href="#/tools" style="color:var(--gold-soft)">הכלים שהכרנו ←</a>
      </nav>
    </div>
  </div>`;
}

function pageHomework(){
  const items=LESSONS.filter(l=>l.homework&&l.homework.length);
  return `<div class="page">
    <h1>שיעורי בית</h1>
    <p class="sub">תרגול קצר אחרי כל מפגש, על הקבצים שבתיקיית הקורס.</p>
    ${items.length?items.map(l=>`
      <section class="hw">
        <header><h2>שיעור ${l.n} — ${esc(l.title)}</h2><span class="date">${esc(l.date)}</span></header>
        <ul>${l.homework.map(h=>`<li>${esc(h)}</li>`).join('')}</ul>
      </section>`).join('')
    :`<div class="empty">עדיין אין משימות פתוחות.</div>`}
  </div>`;
}

function pageTools(){
  const byLesson={};
  TOOLS.forEach(t=>{ (byLesson[t.lesson]=byLesson[t.lesson]||[]).push(t); });
  const keys=Object.keys(byLesson).sort((a,b)=>a-b);
  return `<div class="page">
    <h1>הכלים שהכרנו</h1>
    <p class="sub">כל כלי שעבדנו איתו בשיעור, עם קישור ישיר אליו. הרשימה גדלה אחרי כל מפגש.</p>
    ${keys.map(k=>{
      const l=LESSONS.find(x=>x.n===Number(k));
      return `<h2 class="toolsec">שיעור ${k}${l&&l.title?' — '+esc(l.title):''}</h2>
      <div class="grid13">${byLesson[k].map(t=>`
        <article class="lcard tool">
          <span class="num ltr">${esc(t.name)}</span>
          <h3>${esc(t.he)}</h3>
          <p>${esc(t.note)}</p>
          <a class="btn" href="${t.url}" target="_blank" rel="noopener">
            פתיחת הכלי
            <svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-8 8"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
          </a>
        </article>`).join('')}</div>`;
    }).join('')}

    <h2 class="toolsec" id="sheets-lab">נוסחאות Sheets — תרגול חי</h2>
    <div class="labgrid">
      <section class="lab">
        <h3>יום השבוע מתוך תאריך<span class="tag">TEXT()</span></h3>
        <p class="why">כל תאריך שנכנס לתא — והנוסחה מחזירה את שם היום. חוסך הקלדה בכל טבלת תורים.</p>
        <div class="field">
          <label class="fl" for="fxDate">בחירת תאריך</label>
          <input type="date" id="fxDate" value="2026-09-07">
        </div>
        <div class="readout"><span>תוצאת הנוסחה</span><strong id="fxDayOut">—</strong></div>
        <div class="fx"><code dir="ltr">=TEXT(A2,"DDDD")</code><button class="mini" data-copy='=TEXT(A2,"DDDD")'>העתקה</button></div>
        <p class="say" id="sayDay" role="status"></p>
        <div class="labtip">DDDD מחזיר את שם היום המלא, DDD צורה מקוצרת, ו-DD את מספר היום בחודש.</div>
      </section>

      <section class="lab">
        <h3>גיל מתוך תאריך לידה<span class="tag">TODAY()</span></h3>
        <p class="why">ברשומה רפואית הגיל מתעדכן לבד: הפרש הימים בין היום ליום הלידה, חלקי 365.</p>
        <div class="field">
          <label class="fl" for="fxBirth">תאריך לידה</label>
          <input type="date" id="fxBirth" value="1999-07-13">
        </div>
        <div class="readout"><span>גיל מחושב</span><strong id="fxAgeOut">—</strong></div>
        <div class="fx"><code dir="ltr">=(TODAY()-D2)/365</code><button class="mini" data-copy="=(TODAY()-D2)/365">העתקה</button></div>
        <p class="say" id="sayAge" role="status"></p>
        <div class="labtip">למספר שלם בלי שברים עשרוניים: <code dir="ltr">=INT((TODAY()-D2)/365)</code></div>
      </section>
    </div>

    <h2 class="toolsec" id="sig-lab">מחולל חתימה מקצועית למייל</h2>
    <section class="lab">
      <p class="why">למלא את הפרטים, להעתיק את החתימה ולהדביק ב-Gmail: הגדרות ← הצגת כל ההגדרות ← כללי ← חתימה ← יצירת חתימה חדשה ← הדבקה ← שמירת השינויים.</p>
      <div class="labgrid">
        <div>

function flash(id,msg){ const el=document.getElementById(id); if(!el) return; el.textContent=msg; clearTimeout(el._t); el._t=setTimeout(()=>el.textContent='',2600); }

function copyPlain(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).then(()=>true).catch(()=>legacyCopy(txt));
  return Promise.resolve(legacyCopy(txt));
}
function legacyCopy(txt){
  const ta=document.createElement('textarea'); ta.value=txt;
  ta.style.cssText='position:fixed;top:0;left:-9999px'; document.body.appendChild(ta); ta.select();
  let ok=false; try{ok=document.execCommand('copy');}catch(e){}
  ta.remove(); return ok;
}
function copyRichHTML(html,plain){
  const fb=()=>{
    const d=document.createElement('div'); d.contentEditable='true';
    d.style.cssText='position:fixed;top:0;left:-9999px;white-space:normal';
    d.innerHTML=html; document.body.appendChild(d);
    const r=document.createRange(); r.selectNodeContents(d);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
    let ok=false; try{ok=document.execCommand('copy');}catch(e){}
    s.removeAllRanges(); d.remove(); return ok;
  };
  if(navigator.clipboard&&window.ClipboardItem){
    return navigator.clipboard.write([new ClipboardItem({
      'text/html':new Blob([html],{type:'text/html'}),
      'text/plain':new Blob([plain],{type:'text/plain'})
    })]).then(()=>true).catch(()=>fb());
  }
  return Promise.resolve(fb());
}

let typeTimer=null;
const PHRASES=[
  "תיאום תור לבדיקה ושליחת אישור במייל",
  "טופס קליטה שהתשובות שלו נכנסות לגיליון",
  "מכתב זימון מסודר בשתי דקות",
  "עדכון לכל הכיתה בשליחה אחת",
  "סדר בתיקיית המרפאה בדרייב"
];
function startTyping(){
  clearTimeout(typeTimer);
  const out=document.getElementById('typed'); if(!out) return;
  if(document.body.classList.contains('nomotion')||window.matchMedia('(prefers-reduced-motion:reduce)').matches){
    out.textContent=PHRASES[0]; return;
  }
  let pi=0,ci=0,del=false;
  const keys={}; document.querySelectorAll('.key').forEach(k=>keys[k.dataset.k]=k);
  const hit=ch=>{ const k=keys[ch]; if(!k) return; k.classList.add('hit'); setTimeout(()=>k.classList.remove('hit'),110); };
  (function step(){
    const p=PHRASES[pi];
    if(!del){
      ci++; out.textContent=p.slice(0,ci); hit(p[ci-1]);
      if(ci>=p.length){ del=true; typeTimer=setTimeout(step,1900); return; }
      typeTimer=setTimeout(step,58+Math.random()*55);
    }else{
      ci--; out.textContent=p.slice(0,ci);
      if(ci<=0){ del=false; pi=(pi+1)%PHRASES.length; typeTimer=setTimeout(step,320); return; }
      typeTimer=setTimeout(step,22);
    }
  })();
}

/* ---------- living background: neuron mesh + data pulses ---------- */
(function bgField(){
  const c=document.createElement('canvas'); c.id='bgfield'; c.setAttribute('aria-hidden','true');
  document.body.appendChild(c);
  const ctx=c.getContext('2d');
  let W=0,H=0,nodes=[],pulses=[],raf=null,frozen=false;
  const mouse={x:-9999,y:-9999,on:false};

  function build(){
    const n=Math.round(Math.max(30,Math.min(86,W*H/10000*0.55)));
    nodes=Array.from({length:n},()=>({
      x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-.5)*.20, vy:(Math.random()-.5)*.20,
      r:Math.random()*1.5+1.1, ph:Math.random()*Math.PI*2
    }));
    pulses=[];
  }
  function resize(){
    const dpr=Math.min(2,window.devicePixelRatio||1);
    W=window.innerWidth; H=window.innerHeight;
    c.width=W*dpr; c.height=H*dpr; c.style.width=W+'px'; c.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    build();
  }

  const LINK=138, REACH=190;
  function step(){
    raf=null;
    ctx.clearRect(0,0,W,H);
    const t=performance.now()/1000;

    for(const p of nodes){
      if(!frozen){
        p.x+=p.vx; p.y+=p.vy;
        if(p.x<-20)p.x=W+20; if(p.x>W+20)p.x=-20;
        if(p.y<-20)p.y=H+20; if(p.y>H+20)p.y=-20;
        if(mouse.on){
          const dx=mouse.x-p.x, dy=mouse.y-p.y, d=Math.hypot(dx,dy);
          if(d<REACH&&d>1){ const f=(1-d/REACH)*0.035; p.x+=dx/d*f*d*0.05; p.y+=dy/d*f*d*0.05; }
        }
      }
    }

    // links
    for(let i=0;i<nodes.length;i++){
      const a=nodes[i];
      for(let j=i+1;j<nodes.length;j++){
        const b=nodes[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy);
        if(d>LINK) continue;
        let o=(1-d/LINK)*0.16;
        if(mouse.on){
          const md=Math.min(Math.hypot(mouse.x-a.x,mouse.y-a.y),Math.hypot(mouse.x-b.x,mouse.y-b.y));
          if(md<REACH) o+=(1-md/REACH)*0.30;
        }
        ctx.strokeStyle='rgba(95,212,180,'+o.toFixed(3)+')';
        ctx.lineWidth=0.7; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      }
    }

    // links to the cursor — the reaction
    if(mouse.on){
      for(const p of nodes){
        const d=Math.hypot(mouse.x-p.x,mouse.y-p.y);
        if(d<REACH){
          ctx.strokeStyle='rgba(194,161,90,'+((1-d/REACH)*0.34).toFixed(3)+')';
          ctx.lineWidth=0.8; ctx.beginPath(); ctx.moveTo(mouse.x,mouse.y); ctx.lineTo(p.x,p.y); ctx.stroke();
        }
      }
    }

    // nodes
    for(const p of nodes){
      const near=mouse.on?Math.max(0,1-Math.hypot(mouse.x-p.x,mouse.y-p.y)/REACH):0;
      const breathe=frozen?1:0.75+0.25*Math.sin(t*1.1+p.ph);
      ctx.fillStyle=near>0.25?'rgba(224,198,139,'+(0.35+0.5*near).toFixed(3)+')'
                             :'rgba(157,214,206,'+(0.20+0.22*breathe).toFixed(3)+')';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1+0.8*near),0,6.283); ctx.fill();
    }

    // signals travelling along the mesh
    if(!frozen){
      if(pulses.length<7&&Math.random()<0.05){
        const a=nodes[(Math.random()*nodes.length)|0];
        const cand=nodes.filter(b=>b!==a&&Math.hypot(a.x-b.x,a.y-b.y)<LINK);
        if(cand.length) pulses.push({a,b:cand[(Math.random()*cand.length)|0],t:0,s:0.006+Math.random()*0.009});
      }
      for(let i=pulses.length-1;i>=0;i--){
        const q=pulses[i]; q.t+=q.s;
        if(q.t>=1){ pulses.splice(i,1); continue; }
        const x=q.a.x+(q.b.x-q.a.x)*q.t, y=q.a.y+(q.b.y-q.a.y)*q.t;
        const fade=Math.sin(q.t*Math.PI);
        ctx.fillStyle='rgba(194,161,90,'+(0.75*fade).toFixed(3)+')';
        ctx.beginPath(); ctx.arc(x,y,1.9,0,6.283); ctx.fill();
        ctx.strokeStyle='rgba(194,161,90,'+(0.25*fade).toFixed(3)+')';
        ctx.lineWidth=1.1; ctx.beginPath(); ctx.moveTo(q.a.x,q.a.y); ctx.lineTo(x,y); ctx.stroke();
      }
    }

    if(!frozen) raf=requestAnimationFrame(step);
  }
  const kick=()=>{ if(!raf) raf=requestAnimationFrame(step); };

  window.addEventListener('resize',()=>{ resize(); kick(); });
  window.addEventListener('pointermove',e=>{ mouse.x=e.clientX; mouse.y=e.clientY; mouse.on=true; kick(); },{passive:true});
  document.addEventListener('pointerleave',()=>{ mouse.on=false; kick(); });
  window.addEventListener('blur',()=>{ mouse.on=false; });
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) kick(); });

  window.bgSetCalm=v=>{ frozen=v; if(!v) kick(); else { raf&&cancelAnimationFrame(raf); raf=null; step(); } };
  resize();
  frozen=calm(); kick();
})();

/* ---------- hover reactions: keyboard + ECG ---------- */
const KEY_COLORS=['#5FD4B4','#C2A15A','#7FC7E0','#E0C68B','#9BE3CD','#D9A86C'];
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
function calm(){ return document.body.classList.contains('nomotion')||window.matchMedia('(prefers-reduced-motion:reduce)').matches; }

function wireKeyboard(){
  const box=document.querySelector('.keys'); if(!box) return;
  const keys=[...box.querySelectorAll('.key')];
  keys.forEach((k,i)=>k.style.setProperty('--kc',KEY_COLORS[i%KEY_COLORS.length]));
  let rects=null, raf=null, last=null;
  const measure=()=>{ rects=keys.map(k=>{const r=k.getBoundingClientRect(); return {x:r.left+r.width/2,y:r.top+r.height/2};}); };
  const paint=()=>{
    raf=null; if(!rects||!last) return;
    keys.forEach((k,i)=>{
      const c=rects[i], d=Math.hypot(last.x-c.x,last.y-c.y);
      const p=Math.max(0,1-d/120);
      const col=KEY_COLORS[i%KEY_COLORS.length];
      if(p<=0.02){ k.style.background=''; k.style.color=''; k.style.borderColor=''; k.style.transform=''; return; }
      k.style.background=hexA(col,.10+.7*p);
      k.style.borderColor=hexA(col,.25+.6*p);
      k.style.color=p>.5?'#06222b':'var(--cream)';
      k.style.transform=`translateY(${(-3.5*p).toFixed(1)}px)`;
    });
  };
  const reset=()=>keys.forEach(k=>{k.style.background='';k.style.color='';k.style.borderColor='';k.style.transform='';});
  box.addEventListener('pointerenter',measure);
  box.addEventListener('pointermove',e=>{
    if(calm()){ reset(); return; }
    if(!rects) measure();
    last={x:e.clientX,y:e.clientY}; if(!raf) raf=requestAnimationFrame(paint);
  });
  box.addEventListener('pointerleave',()=>{ last=null; reset(); });
  window.addEventListener('resize',()=>{ rects=null; });
}

function ecgD(cx){
  const W=1100, base=32;
  const beat=(x,a)=>` L ${x-26} ${base} L ${x-15} ${base-4*a} L ${x-7} ${base+8*a} L ${x} ${base-24*a} L ${x+8} ${base+11*a} L ${x+19} ${base}`;
  const pts=[{x:170,a:1},{x:440,a:1},{x:710,a:1},{x:980,a:1}];
  if(cx!=null) pts.push({x:Math.max(60,Math.min(W-60,cx)),a:1.35});
  pts.sort((p,q)=>p.x-q.x);
  let d=`M 0 ${base}`;
  pts.forEach(p=>{ d+=` L ${p.x-34} ${base}`+beat(p.x,p.a); });
  return d+` L ${W} ${base}`;
}
function wireECG(){
  const wrap=document.getElementById('ecgwrap'), tr=document.getElementById('ecgTrace'), blip=document.getElementById('ecgBlip');
  if(!wrap||!tr) return;
  tr.setAttribute('d',ecgD(null));
  let raf=null, x=null;
  const paint=()=>{ raf=null; tr.setAttribute('d',ecgD(x)); if(blip&&x!=null){ blip.setAttribute('cx',x); blip.setAttribute('cy',32-24*1.35); } };
  wrap.addEventListener('pointermove',e=>{
    if(calm()) return;
    const r=wrap.getBoundingClientRect();
    x=(e.clientX-r.left)/r.width*1100;
    if(!raf) raf=requestAnimationFrame(paint);
  });
  wrap.addEventListener('pointerleave',()=>{ x=null; tr.setAttribute('d',ecgD(null)); if(blip) blip.setAttribute('cx',-20); });
}

/* ---------- accessibility panel ---------- */
const store={
  get(){ try{return JSON.parse(localStorage.getItem('a11y-k16')||'{}')}catch(e){return{}} },
  set(v){ try{localStorage.setItem('a11y-k16',JSON.stringify(v))}catch(e){} }
};
let prefs=Object.assign({fs:100,hc:false,links:false,nomotion:false},store.get());
function applyPrefs(){
  document.documentElement.style.setProperty('--fs',prefs.fs+'%');
  ['hc','links','nomotion'].forEach(k=>document.body.classList.toggle(k,!!prefs[k]));
  document.querySelectorAll('[data-tog]').forEach(b=>{
    const on=!!prefs[b.dataset.tog];
    b.setAttribute('aria-pressed',on); b.textContent=on?'כיבוי':'הפעלה';
  });
  store.set(prefs);
}
const panel=document.getElementById('a11ypanel'), a11ybtn=document.getElementById('a11ybtn');
a11ybtn.addEventListener('click',()=>{
  const open=panel.dataset.open!=='true';
  panel.dataset.open=open; a11ybtn.setAttribute('aria-expanded',open);
  if(open) panel.querySelector('button').focus();
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&panel.dataset.open==='true'){panel.dataset.open='false';a11ybtn.setAttribute('aria-expanded','false');a11ybtn.focus();} });
panel.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.fs){ prefs.fs=Math.min(145,Math.max(85,prefs.fs+(b.dataset.fs==='+'?10:-10))); }
  else if(b.dataset.tog){ prefs[b.dataset.tog]=!prefs[b.dataset.tog]; if(b.dataset.tog==='nomotion'){ document.body.classList.toggle('nomotion',!!prefs.nomotion); startTyping(); if(window.bgSetCalm) bgSetCalm(calm()); } }
  else if(b.id==='a11yreset'){ prefs={fs:100,hc:false,links:false,nomotion:false}; document.body.classList.remove('nomotion'); startTyping(); if(window.bgSetCalm) bgSetCalm(calm()); }
  applyPrefs();
});

applyPrefs();
render();
</script>
</body>
